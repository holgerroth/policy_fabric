<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1235" viewBox="0 0 1600 1235" role="img" aria-labelledby="title description">
  <title id="title">Policy Fabric and NVFlare: deployment decisions for discussion</title>
  <desc id="description">Logical integration responsibilities with the Policy Fabric client installed in the researcher environment. The Recipe submission hook signs, freezes and hashes the application, calls the Policy Fabric client, and attaches the returned capability before standard NVFlare submission. The client communicates with the capability issuer; issuance authority remains with Policy Fabric. The implemented client bridge uses the inference runner and trusted Script digest evidence; the standalone demo instead selects mock issuance. Both the issuer and Guardian are shown in separate dashed areas with hosting and administration unresolved. The Guardian is outside the site box to avoid assigning a location, not to select remote hosting. At each site NVFlare hashes the application, obtains a Guardian decision, and runs the job only after allow and native checks. Both configured Guardian modes currently use loopback HTTP. Neutral boxes identify deployment locations, green identifies NVFlare and integration components, and blue identifies Policy Fabric components.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56616D"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#568600"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072CE"/>
    </marker>
    <!-- Role icons: UserRound, Laptop, UserRoundCog, ShieldUser from Lucide.
